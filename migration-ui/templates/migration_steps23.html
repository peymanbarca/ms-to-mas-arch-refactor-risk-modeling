


<h1>Step 2: Migration Policy</h1>

<section class="card" id="step1">

<h2>1. Acceptance Predicates</h2>

<div class="predicate">

    <input
        type="checkbox"
        id="qa"
        checked
        onchange="togglePredicate('qa')">

    <label class="tooltip">
        QA (Consistency Preservation) ⓘ
        <span class="tooltiptext">
            Minimum percentage of functional correctness (invariant satisfacation)
            that must be preserved after migration.
            Migration is accepted only if QA ≥ threshold.
        </span>
    </label>

    <div class="slider-container">

        <input
            id="qaThreshold"
            type="range"
            min="80"
            max="100"
            step="1"
            value="100"
            oninput="updateSliderValue('qaThreshold')">

        <span id="qaThresholdValue">100%</span>

    </div>

</div>



<div class="predicate">

    <input
        type="checkbox"
        id="latency"
        checked
        onchange="togglePredicate('latency')">

    <label class="tooltip">
        Latency Inflation ⓘ
        <span class="tooltiptext">
            Maximum acceptable increase in P95 latency
            relative to the original microservice architecture.
        </span>
    </label>

    <div class="slider-container">

        <input
            id="latencyThreshold"
            type="range"
            min="0"
            max="200"
            step="5"
            value="90"
            oninput="updateSliderValue('latencyThreshold')">

        <span id="latencyThresholdValue">90%</span>

    </div>

</div>



<div class="predicate">

    <input
        type="checkbox"
        id="failure"
        checked
        onchange="togglePredicate('failure')">

    <label class="tooltip">
        Failure Rate ⓘ
        <span class="tooltiptext">
            Maximum acceptable application-level failure
            rate before migration is rejected or rolled back.
        </span>
    </label>

    <div class="slider-container">


          <input
            id="failureThreshold"
            type="range"
            min="0"
            max="5"
            step="0.1"
            value="2"
            oninput="updateSliderValue('failureThreshold')">

            <span id="failureThresholdValue">2%</span>

    </div>

</div>

<button onclick="validatePredicates()">

Confirm Predicates

</button>

</section>



<section class="card disabled" id="step2">

<h2>2. Governance</h2>

<input type="radio" name="gov" value="off" checked>

<div class="governance-options">

    <label class="gov-option selected">

        <input
            type="radio"
            name="gov"
            value="off"
            checked
            onchange="updateGovernanceSelection()">

        <div class="gov-content">

            <div class="gov-title">
                <span class="gov-radio"></span>
                <span>Off</span>
            </div>

            <div class="gov-description">
                No governance mechanism is applied during migration.
            </div>

        </div>

    </label>


    <label class="gov-option">

        <input
            type="radio"
            name="gov"
            value="auto"
            onchange="updateGovernanceSelection()">

        <div class="gov-content">

            <div class="gov-title">
                <span class="gov-radio"></span>
                <span>Automatic ITL/OTL</span>
            </div>

            <div class="gov-description">
                Automatically evaluates migration behavior and
                triggers governance actions when thresholds are violated.
            </div>

        </div>

    </label>


    <label class="gov-option">

        <input
            type="radio"
            name="gov"
            value="human"
            onchange="updateGovernanceSelection()">

        <div class="gov-content">

            <div class="gov-title">

                <span class="gov-radio"></span>

                <span>
                    HITL (Human-in-the-Loop)
                    <small></small>
                </span>

                <!-- <span class="coming-soon">
                    Coming soon
                </span> -->

            </div>

            <div class="gov-description">
                Human-in-the-Loop intervention is used for migration governance
                and post-migration decisions.
            </div>

        </div>

    </label>

</div>


<div class="grid2">

<!-- Beta -->
<label class="tooltip">
    b (%) ⓘ
    <span class="tooltiptext">
        partitions the R requests into non-overlapping tumbling blocks of b each (e.g. b = 20% of R) used for OTL.
    </span>
</label>

<div class="slider-container">
    <input
        id="beta"
        type="range"
        min="10"
        max="50"
        step="1"
        value="30"
        oninput="updateSliderValue('beta')">
    <span id="betaValue">30%</span>
</div>


<!-- gmid -->
<label class="tooltip">
    g<sub>mid</sub> (%) ⓘ
    <span class="tooltiptext">
         grace threshold gmid a fraction of b (e.g. 30% of b), to detect sustained violation in OTL.
    </span>
</label>

<div class="slider-container">
    <input
        id="gmid"
        type="range"
        min="10"
        max="50"
        step="1"
        value="20"
        oninput="updateSliderValue('gmid')">
    <span id="gmidValue">20%</span>
</div>


<!-- deltaL -->
<label class="tooltip">
    δL (%) ⓘ
    <span class="tooltiptext">
        small tolerance bands for latency inflation, used for ITL.
    </span>
</label>

<div class="slider-container">
    <input
        id="deltaL"
        type="range"
        min="0"
        max="20"
        step="1"
        value="10"
        oninput="updateSliderValue('deltaL')">
    <span id="deltaLValue">10%</span>
</div>


<!-- deltaSLO -->
<label class="tooltip">
    δSLO (%) ⓘ
    <span class="tooltiptext">
        small tolerance bands for failure rate, used for ITL.
    </span>
</label>

<div class="slider-container">
    <input
        id="deltaSLO"
        type="range"
        min="0"
        max="1"
        step="0.1"
        value="0.5"
        oninput="updateSliderValue('deltaSLO')">
    <span id="deltaSLOValue">0.5%</span>
</div>


<!-- deltaTP -->
<label class="tooltip">
    δTProp ⓘ
    <span class="tooltiptext">
        small tolerance bands for TProp, used for ITL.
    </span>
</label>

<div class="slider-container">
    <input
        id="deltaTP"
        type="range"
        min="0"
        max="0.2"
        step="0.01"
        value="0.10"
        oninput="updateSliderValue('deltaTP')">
    <span id="deltaTPValue">0.10</span>
</div>


<!-- gpost -->
<label class="tooltip">
    g<sub>post</sub> (%) ⓘ
    <span class="tooltiptext">
        grace-window threshold as a fraction of R (e.g. 30% of R) to detect sustained violation in ITL.
    </span>
</label>

<div class="slider-container">
    <input
        id="gpost"
        type="range"
        min="10"
        max="50"
        step="1"
        value="30"
        oninput="updateSliderValue('gpost')">
    <span id="gpostValue">30%</span>
</div>

</div>


<button onclick="validateGovernance()">

Confirm Governance Mode

</button>

</section>



<h1>Step 3: Runtime Execution</h1>

<section class="card disabled" id="step3">

<h2>3. Experiment Configuration</h2>

<div class="grid2">

<label class="tooltip">
    Total Requests (R) ⓘ
    <span class="tooltiptext">
        Total number of workload requests executed during
        the migration experiment at each step.
    </span>
</label>

<div class="slider-container">

    <span class="slider-min">100</span>

    <input
        id="totalRequests"
        type="range"
        min="100"
        max="10000"
        step="100"
        value="5000"
        oninput="updateSliderValue('totalRequests')">

    <span class="slider-max">10000</span>

    <span 
        id="totalRequestsValue"
        class="slider-value">
        5000
    </span>

</div>



<label class="tooltip">
    Concurrency Rate ⓘ
    <span class="tooltiptext">
        Number of concurrent workload requests
        submitted during execution.
    </span>
</label>

<div class="slider-container">

    <span class="slider-min">1</span>

    <input
        id="concurrency"
        type="range"
        min="1"
        max="300"
        step="1"
        value="20"
        oninput="updateSliderValue('concurrency')">

    <span class="slider-max">300</span>

    <span 
        id="concurrencyValue"
        class="slider-value">
        20
    </span>

</div>



<label class="tooltip">
    LLM Model ⓘ
    <span class="tooltiptext">
        Language model used by the agents
    </span>
</label>

<div class="model-selector">

    <select id="llmModel">

        <option value="llama3.2:3b">
            llama3.2:3b (Llama 3.2, 3B parameters)
        </option>

        <option value="llama3:8b">
            llama3:8b (Llama 3, 8B parameters)
        </option>

        <option value="qwen3:14b">
            qwen3:14b (Qwen 3, 14B parameters)
        </option>

    </select>

</div>

<p></p>

<label class="tooltip">
    Temperature ⓘ
    <span class="tooltiptext">
        LLM sampling randomness.
        Lower values provide more deterministic behavior.
    </span>
</label>

<div class="slider-container">

    <span class="slider-min">0</span>

    <input
        id="temperature"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="0.0"
        oninput="updateSliderValue('temperature')">

    <span class="slider-max">1</span>

    <span
        id="temperatureValue"
        class="slider-value">
        0.0
    </span>

</div>


</div>

<button id="start">

🚀 Start Migration

</button>

</section>

<section class="card">

<h2>Experiment Logs</h2>

<div class="log-console">

    <pre id="logs">Waiting for experiment...</pre>

</div>


<div
    id="humanInputPanel"
    class="human-input-panel"
    style="display:none;">

    <div class="input-prompt">

        Awaiting human adjudication:

    </div>


    <button
        onclick="sendExperimentInput('A')"
        class="decision-button accept">

        ✓ Accept (A)

    </button>


    <button
        onclick="sendExperimentInput('R')"
        class="decision-button reject">

        ✕ Reject (R)

    </button>


    <button
        onclick="sendExperimentInput('H')"
        class="decision-button help">

        ? Help (H)

    </button>

</div>

</section>

</div>
